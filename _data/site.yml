description: PREMIS lab (Precision Medicine with Intelligent Systems) develops
  quantitative imaging and machine learning tools to decode complex medical data
  and improve clinical decision-making in oncology. Martinos Center,
  Massachusetts General Hospital and Harvard Medical School.
