# Site settings for Jekyll, which GitHub Pages runs on every push to main.
title: PREMIS lab
url: https://premis-lab.github.io
baseurl: ""
timezone: UTC

# News stories live in _posts/ and are published at /news/<file-name-without-date>/
permalink: /news/:title/
defaults:
  - scope:
      type: posts
    values:
      layout: post
  # Google Search Console's ownership file stays out of the sitemap
  - scope:
      path: google38276e39ce5844dc.html
    values:
      sitemap: false

markdown: kramdown

# Builds /sitemap.xml (and a robots.txt pointing to it) for search engines
plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - tools
  - Gemfile
  - Gemfile.lock
  - vendor
