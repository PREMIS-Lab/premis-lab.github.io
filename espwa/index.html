<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESPWA · SABCS 2026 · AR demo</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --purple: #6a1b9a; --espwa: #800080; --ink: #1b1530; --muted: #5b5670; --tint: #f5eef9;
          --tcga: #e0706a; --tcgazl: #17756a; --bwh: #4f7fe0; --mir: #d22b2b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; }
  #intro { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 28px; gap: 18px; background: #fff; z-index: 10; }
  #intro h1 { margin: 0; font-size: 28px; line-height: 1.15; color: var(--purple); }
  #intro p { margin: 0; font-size: 17px; line-height: 1.4; color: var(--muted); }
  .btn { appearance: none; border: 0; border-radius: 12px; padding: 16px 18px; font-size: 18px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--purple); color: #fff; }
  .btn.ghost { background: var(--tint); color: var(--purple); }
  .fine { font-size: 13px !important; }
  #ar { position: fixed; inset: 0; display: none; }
  #flat { display: none; padding: 20px; }
  #close { position: fixed; top: 14px; right: 14px; z-index: 20; display: none; }

  /* Panel anchored on Figure 2: 1000 px = width of the printed figure */
  .panel { width: 1000px; height: 667px; padding: 34px 44px; border-radius: 22px; background: rgba(255,255,255,0.94);
           box-shadow: 0 18px 50px rgba(40,10,60,0.35); font-size: 30px; line-height: 1.25; }
  .panel h2 { margin: 0 0 10px; font-size: 40px; line-height: 1.12; color: var(--purple); }
  .panel .sub { margin: 0 0 22px; color: var(--muted); font-size: 26px; }
  .row { display: grid; grid-template-columns: 330px 1fr 92px; align-items: center; column-gap: 16px; margin: 10px 0; opacity: 0.12; transition: opacity 0.6s; }
  .row.on { opacity: 1; }
  .row .lab { font-size: 24px; line-height: 1.15; }
  .track { position: relative; height: 40px; background: #eee9f2; border-radius: 8px; overflow: hidden; }
  .chance { position: absolute; top: 0; bottom: 0; width: 3px; background: #9a93a8; left: 0%; }
  .bar { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 8px; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .val { font-weight: 700; font-size: 30px; text-align: right; }
  .note { margin-top: 16px; min-height: 76px; padding: 14px 18px; border-radius: 12px; background: var(--tint); font-size: 25px; line-height: 1.25; }
  .scale { display: flex; justify-content: space-between; margin: 2px 108px 0 346px; font-size: 18px; color: var(--muted); }

  /* Same panel in the page when the camera is not used */
  #flat .panel { width: 100%; height: auto; padding: 18px; font-size: 16px; box-shadow: none; border: 1px solid #e6dcef; }
  #flat .panel h2 { font-size: 22px; } #flat .panel .sub { font-size: 15px; }
  #flat .row { grid-template-columns: 1fr 64px; row-gap: 4px; }
  #flat .row .lab { grid-column: 1 / span 2; font-size: 15px; }
  #flat .val { font-size: 18px; } #flat .track { height: 22px; } #flat .note { font-size: 15px; min-height: 0; }
  #flat .scale { display: none; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>

<div id="intro">
  <h1>ESPWA · interactive poster</h1>
  <p>Point your phone at the <b>title of the poster</b>. An interactive panel will appear on top of it.</p>
  <button class="btn primary" id="start">Start camera</button>
  <button class="btn ghost" id="noCam">View without camera</button>
  <p class="fine">Demo for SABCS 2026, poster P3-3-16. The values shown are examples, not study results. The camera image stays on your phone.</p>
</div>

<button class="btn ghost" id="close">Close</button>
<div id="ar"></div>
<div id="flat"></div>

<template id="panelTpl">
  <div class="panel">
    <h2>Demo: an interactive figure</h2>
    <p class="sub">Example values, not study results</p>
    <div class="row" data-step="0"><div class="lab">Example A</div><div class="track"><div class="chance"></div><div class="bar" style="background:var(--tcga)" data-v="0.85"></div></div><div class="val" style="color:var(--tcga)">0.85</div></div>
    <div class="row" data-step="1"><div class="lab">Example B</div><div class="track"><div class="chance"></div><div class="bar" style="background:var(--tcgazl)" data-v="0.65"></div></div><div class="val" style="color:var(--tcgazl)">0.65</div></div>
    <div class="row" data-step="2"><div class="lab">Example C</div><div class="track"><div class="chance"></div><div class="bar" style="background:var(--espwa)" data-v="0.75"></div></div><div class="val" style="color:var(--espwa)">0.75</div></div>
    <div class="row" data-step="3"><div class="lab">Example D</div><div class="track"><div class="chance"></div><div class="bar" style="background:var(--bwh)" data-v="0.80"></div></div><div class="val" style="color:var(--bwh)">0.80</div></div>
    <div class="row" data-step="3"><div class="lab">Example E</div><div class="track"><div class="chance"></div><div class="bar" style="background:var(--mir)" data-v="0.80"></div></div><div class="val" style="color:var(--mir)">0.80</div></div>
    <div class="scale"><span>0.5</span><span>0.75</span><span>1.0</span></div>
    <div class="note"></div>
  </div>
</template>

<script type="module">
import * as THREE from "three";
import { CSS3DObject } from "three/addons/renderers/CSS3DRenderer.js";
import { MindARThree } from "./vendor/mindar-image-three.prod.js";

const NOTES = [
  "Each bar appears in turn, with a short explanation of what it shows.",
  "In the real version, each figure of the poster opens its own panel.",
  "Panels can hold animations, high-resolution images or short audio.",
  "Example values only: the study results appear after the SABCS embargo."
];

function makePanel() {
  return document.getElementById("panelTpl").content.firstElementChild.cloneNode(true);
}

// Bars start at AUROC 0.5 (chance) so the differences are visible.
function showStep(panel, step) {
  panel.querySelectorAll(".row").forEach(row => {
    const on = Number(row.dataset.step) <= step;
    row.classList.toggle("on", on);
    const bar = row.querySelector(".bar");
    bar.style.width = on ? `${(Number(bar.dataset.v) - 0.5) / 0.5 * 100}%` : "0";
  });
  panel.querySelector(".note").textContent = NOTES[step];
}

function play(panel) {
  clearTimeout(panel._timer);
  let step = 0;
  const next = () => {
    showStep(panel, step);
    step += 1;
    if (step < NOTES.length) panel._timer = setTimeout(next, 3200);
  };
  next();
}

document.getElementById("noCam").onclick = () => {
  document.getElementById("intro").style.display = "none";
  const flat = document.getElementById("flat");
  flat.style.display = "block";
  const panel = makePanel();
  flat.appendChild(panel);
  play(panel);
};

document.getElementById("start").onclick = async () => {
  document.getElementById("intro").style.display = "none";
  const container = document.getElementById("ar");
  container.style.display = "block";
  document.getElementById("close").style.display = "block";

  const mindar = new MindARThree({ container, imageTargetSrc: "./targets/targets.mind", filterMinCF: 0.0005, filterBeta: 0.01 });
  const { renderer, cssRenderer, scene, cssScene, camera } = mindar;

  // Purple frame around the detected figure (WebGL, 1 unit = figure width).
  const anchor = mindar.addAnchor(0);
  const aspect = 113 / 1000;
  const frame = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(1.02, aspect + 0.02)),
    new THREE.LineBasicMaterial({ color: 0x7e22ce })
  );
  anchor.group.add(frame);

  // Panel floating slightly in front of the figure (CSS, 1000 px = figure width).
  const cssAnchor = mindar.addCSSAnchor(0);
  const panel = makePanel();
  const obj = new CSS3DObject(panel);
  obj.position.set(0, -(113 / 2 + 30 + 667 / 2), 40);
  cssAnchor.group.add(obj);
  cssAnchor.onTargetFound = () => play(panel);

  await mindar.start();
  renderer.setAnimationLoop(() => {
    renderer.render(scene, camera);
    cssRenderer.render(cssScene, camera);
  });
  window.__mindar = mindar;

  document.getElementById("close").onclick = () => {
    mindar.stop(); renderer.setAnimationLoop(null); location.reload();
  };
};
</script>
</body>
</html>
