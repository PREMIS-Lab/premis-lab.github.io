# Pages CMS (https://pagescms.org): turns the site's content into forms you can edit in the browser.
# Each entry below is one menu item; together they cover every text on the site.
# Saving a form commits the change and GitHub Pages republishes the site.

# Commits made from Pages CMS carry the name and email of the person who saved them
settings:
  commit:
    identity: user

media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: home
    label: Home page
    description: Texts of the home page. Team and Software have their own entries.
    type: file
    path: _data/home.yml
    fields:
      - name: hero
        label: Banner
        type: object
        fields:
          - name: eyebrow
            label: Small line above the title
            type: string
          - name: title
            label: Title
            description: Put *asterisks* around the words to show in purple, e.g. "... into *clinical evidence*."
            type: string
          - name: text
            label: Description
            type: text
          - name: button
            label: First button
            type: string
          - name: second_button
            label: Second button
            type: string
      - name: about
        label: About the lab
        type: object
        fields:
          - name: title
            label: Section title
            type: string
          - name: text
            label: Text
            description: Words in italics are highlighted in color (purple, pink, orange, in that order). The second paragraph is where the Research links land.
            type: rich-text
          - name: image
            label: Photo
            description: Shown next to the text (below it on phones), cropped to a square. Leave empty for text only.
            type: image
          - name: image_caption
            label: Photo caption
            type: string
          - name: image_alt
            label: Photo description for screen readers (optional)
            description: Defaults to the caption.
            type: string
      - name: publications
        label: Publications section
        description: The papers themselves load automatically from PubMed.
        type: object
        fields:
          - name: title
            label: Section title
            type: string
          - name: intro
            label: Intro
            type: text
          - name: button
            label: Button
            type: string
      - name: news
        label: News section
        description: The stories themselves are edited under News.
        type: object
        fields:
          - name: title
            label: Section title
            type: string
          - name: intro
            label: Intro
            type: text
          - name: button
            label: Button
            type: string

  - name: team
    label: Team
    description: The three groups of the Team section, with their titles and people.
    type: file
    path: _data/team.yml
    fields:
      - name: principal_investigators
        label: Principal Investigators
        type: object
        fields:
          - name: title
            label: Section title
            type: string
          - name: intro
            label: Intro
            description: Line under the section title. Leave empty to hide it.
            type: text
          - name: people
            label: People
            description: Use "Add an item" to add someone, the item menu to remove them, and drag to reorder.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.name}"
            fields:
              - name: name
                label: Name
                type: string
                required: true
              - name: photo
                label: Photo
                description: Square photo, about 300 × 300 pixels.
                type: image
              - name: role
                label: Role in the lab
                type: string
              - name: position
                label: Position
                type: string
              - name: bio
                label: Bio
                type: text
              - name: credentials
                label: Training and awards
                type: text
              - name: email
                label: Email
                type: string
              - name: profile
                label: Profile link
                type: string
      - name: research_team
        label: Research Team
        type: object
        fields:
          - name: title
            label: Section title
            type: string
          - name: intro
            label: Intro
            description: Line under the section title. Leave empty to hide it.
            type: text
          - name: people
            label: People
            description: Use "Add an item" to add someone, the item menu to remove them, and drag to reorder.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.name}"
            fields:
              - name: name
                label: Name
                type: string
                required: true
              - name: photo
                label: Photo
                description: Square photo, about 300 × 300 pixels. Without one, the person's initials are shown.
                type: image
              - name: role
                label: Role
                type: string
              - name: bio
                label: Bio
                type: text
      - name: alumni
        label: Alumni
        type: object
        fields:
          - name: title
            label: Section title
            type: string
          - name: intro
            label: Intro
            description: Line under the section title. Leave empty to hide it.
            type: text
          - name: people
            label: People
            description: Use "Add an item" to add someone, the item menu to remove them, and drag to reorder.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.name}"
            fields:
              - name: name
                label: Name
                type: string
                required: true
              - name: photo
                label: Photo
                description: Square photo, about 300 × 300 pixels. Without one, the person's initials are shown.
                type: image
              - name: role
                label: Role
                type: string
              - name: bio
                label: What they worked on
                type: text

  - name: news
    label: News
    description: Stories shown on the home page (newest three) and on /news/.
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: category
        label: Category
        description: Short label above the title, e.g. "Radiology · AI at scale".
        type: string
      - name: color
        label: Category color
        type: select
        default: purple
        options:
          values:
            - { value: purple, label: Purple }
            - { value: pink, label: Pink }
            - { value: orange, label: Orange }
      - name: summary
        label: Summary
        description: One or two sentences, shown on the news card and under the title.
        type: text
      - name: image
        label: Figure
        type: image
      - name: card_image
        label: Card image (optional)
        description: A smaller copy of the figure for the news cards. Leave empty to use the figure.
        type: image
      - name: image_caption
        label: Figure caption
        type: text
      - name: image_credit
        label: Figure credit
        description: Shown after the caption, e.g. "from the paper, Radiology."
        type: string
      - name: body
        label: Text (optional)
        description: Free text shown below the figure.
        type: rich-text
      - name: abstract
        label: Abstract
        description: One entry per paragraph. The label (e.g. Background, Results) is optional.
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: text
            label: Paragraph
            type: text
      - name: paper
        label: The paper
        type: object
        fields:
          - name: title
            label: Paper title
            type: string
          - name: citation
            label: Citation
            description: e.g. "Radiology. 2021 Feb;298(2):319-329."
            type: string
          - name: lab_authors
            label: Lab authors
            description: e.g. "Kim AE, Bridge CP"
            type: string
          - name: pubmed
            label: PubMed link
            type: string
          - name: doi
            label: DOI
            description: Only the identifier, e.g. 10.1148/radiol.2020201640
            type: string

  - name: publications
    label: Publications (PubMed)
    description: Rules for the Recent Publications carousel, which loads the papers live from PubMed.
    type: file
    path: _data/publications.yml
    fields:
      - name: authors
        label: Lab authors to search
        description: Written as PubMed lists them, surname and initials, e.g. "Kim AE".
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name in PubMed
            type: string
            required: true
          - name: also
            label: Other spellings
            description: Other ways the same person appears in author lists, e.g. "Pulido D".
            type: string
            list: true
      - name: min_lab_authors
        label: Minimum lab authors per paper
        description: 1 shows every paper by anyone above; 2 only papers where two or more of them are authors.
        type: number
        options:
          min: 1
      - name: max_items
        label: Number of papers shown
        type: number
        options:
          min: 1
      - name: order
        label: Order
        type: select
        default: newest
        options:
          values:
            - { value: newest, label: Newest first }
            - { value: lab_authors, label: Most lab authors first, then newest }
      - name: since_year
        label: Only papers from this year on
        description: Leave empty for no limit.
        type: number
      - name: include_preprints
        label: Include preprints (bioRxiv, medRxiv, arXiv)
        type: boolean
        default: true
      - name: exclude
        label: Papers to hide (PMID)
        description: The number at the end of the paper's PubMed address, e.g. 42550018.
        type: string
        list: true

  - name: software
    label: Software
    type: file
    path: _data/software.yml
    fields:
      - name: title
        label: Section title
        type: string
      - name: intro
        label: Intro
        type: text
      - name: button
        label: Button
        type: string
      - name: button_link
        label: Button link
        description: Leave empty to hide the button.
        type: string
      - name: projects
        label: Projects
        description: Use "Add an item" to add a project, the item menu to remove it, and drag to reorder.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: url
            label: Link
            type: string
          - name: icon
            label: Icon
            description: An icon name from lucide.dev/icons, e.g. brain, microscope, database.
            type: string
          - name: description
            label: Description
            type: text
          - name: tag
            label: Tag line
            description: e.g. "Python · Radiology 2026"
            type: string
          - name: color
            label: Dot color
            type: select
            default: purple
            options:
              values:
                - { value: purple, label: Purple }
                - { value: pink, label: Pink }
                - { value: orange, label: Orange }

  - name: site
    label: Menu, footer and other pages
    description: Default theme, texts shared by every page, the News page and the error page.
    type: file
    path: _data/site.yml
    fields:
      - name: description
        label: Description for Google and link previews
        description: One or two sentences shown under the site's name in search results. News stories use their own summary.
        type: text
      - name: default_theme
        label: Default theme
        description: What a first-time visitor sees. Each visitor can still switch with the moon button.
        type: select
        default: light
        options:
          values:
            - { value: light, label: Light }
            - { value: dark, label: Dark }
            - { value: system, label: Follow the visitor's device }
      - name: menu
        label: Menu
        description: Links in the top menu. A link starting with # goes to a section of the home page (#about, #research, #news, #publications, #team, #software, #contact).
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.label}"
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: link
            label: Link
            type: string
            required: true
          - name: large_screens_only
            label: Hide on tablets
            description: Shown only on large screens, where the menu has room for it.
            type: boolean
      - name: footer
        label: Footer
        type: object
        fields:
          - name: address
            label: Address
            description: One line per address line.
            type: text
          - name: email
            label: Contact email
            type: string
          - name: affiliations_title
            label: Affiliations title
            type: string
          - name: connect_title
            label: Social links title
            type: string
          - name: linkedin
            label: LinkedIn link
            type: string
          - name: github
            label: GitHub link
            type: string
          - name: instagram
            label: Instagram link
            type: string
          - name: copyright
            label: Copyright line
            description: Shown after "© <current year>".
            type: string
          - name: credit
            label: Image credits
            type: string
      - name: news_page
        label: News page
        type: object
        fields:
          - name: eyebrow
            label: Small line above the title
            type: string
          - name: title
            label: Title
            type: string
          - name: intro
            label: Intro
            type: text
      - name: not_found
        label: Error page (page not found)
        type: object
        fields:
          - name: eyebrow
            label: Small line above the title
            type: string
          - name: title
            label: Title
            type: string
          - name: button
            label: Button
            type: string
