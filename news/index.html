---
layout: default
title: News
---
<section class="py-16 md:py-24">
	<div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
		<p class="font-mono text-[11px] uppercase tracking-[0.2em] text-slate-400 dark:text-slate-500">{{ site.data.site.news_page.eyebrow | escape }}</p>
		<h1 class="mt-4 text-4xl font-bold text-slate-900 dark:text-white">{{ site.data.site.news_page.title | escape }}</h1>
		<p class="mt-5 max-w-2xl text-lg leading-relaxed text-slate-600 dark:text-slate-300">
			{{ site.data.site.news_page.intro | escape }}
		</p>

		<div class="mt-14 grid gap-6 sm:grid-cols-2">
			{%- for post in site.posts %}
			{% include news-card.html post=post %}
			{%- endfor %}
		</div>

		<div class="mt-12"></div>
	</div>
</section>
